version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agentforge_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agentforge_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentforge_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/agentforge
      - ENV=development
      - LOG_LEVEL=INFO
    depends_on:
      - db
    networks:
      - agentforge_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentforge_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - agentforge_network

volumes:
  postgres_data:

networks:
  agentforge_network:
    driver: bridge
